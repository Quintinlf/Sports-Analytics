<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MLB Analyst Feedback</title>
  <style>
    :root {
      --bg: #f6f5f0;
      --ink: #1f2937;
      --accent: #0f766e;
      --soft: #e2e8f0;
      --warn: #b91c1c;
      --card: #ffffff;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #fff7ed 0%, #f6f5f0 45%, #eef2f7 100%);
      padding: 24px;
    }

    header {
      max-width: 980px;
      margin: 0 auto 24px auto;
      padding: 18px 22px;
      background: linear-gradient(130deg, #0f766e, #0ea5a8);
      border-radius: 14px;
      color: #f8fafc;
      box-shadow: var(--shadow);
    }

    header h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      letter-spacing: 0.4px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--soft);
    }

    .card h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      color: #0f172a;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    select, textarea, input[type="text"], input[type="range"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5f5;
      background: #f8fafc;
      font-size: 14px;
    }

    textarea { min-height: 80px; }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid.two {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      font-size: 13px;
    }

    .cta {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
    }

    .status.error { color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <h1>MLB Analyst Feedback</h1>
    <p>Submit feedback after predictions are generated and before games begin.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Game Selection</h2>
      <div class="grid two">
        <div>
          <label for="analyst_id">Analyst</label>
          <select id="analyst_id">
            <option value="">Select analyst</option>
            <option value="lamar">Lamar (sports logic)</option>
            <option value="anderson">Anderson (sports logic)</option>
            <option value="luis">Luis (sports logic)</option>
            <option value="alex">Alex (betting logic)</option>
          </select>
        </div>
        <div>
          <label for="prediction_id">Game</label>
          <select id="prediction_id"></select>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Postgame Summary</h2>
      <div class="grid two">
        <div>
          <label for="review_stage">Review stage</label>
          <select id="review_stage">
            <option value="post_game">Post-game</option>
            <option value="pre_game">Pre-game</option>
          </select>
        </div>
        <div>
          <label for="outcome_correct">Winner outcome</label>
          <select id="outcome_correct">
            <option value="">Select</option>
            <option value="correct_winner">Correct winner</option>
            <option value="wrong_winner">Wrong winner</option>
            <option value="unknown">Unknown</option>
          </select>
        </div>
        <div>
          <label for="spread_accuracy">Spread accuracy</label>
          <select id="spread_accuracy">
            <option value="">Select</option>
            <option value="within_1">Within 1</option>
            <option value="within_2">Within 2</option>
            <option value="within_3">Within 3</option>
            <option value="off_by_3_plus">Off by 3+</option>
            <option value="not_applicable">Not applicable</option>
          </select>
        </div>
        <div>
          <label for="confidence_alignment">Confidence alignment</label>
          <select id="confidence_alignment">
            <option value="">Select</option>
            <option value="aligned">Aligned</option>
            <option value="overconfident">Overconfident</option>
            <option value="underconfident">Underconfident</option>
          </select>
        </div>
        <div>
          <label for="variance_assessment">Variance assessment</label>
          <select id="variance_assessment">
            <option value="">Select</option>
            <option value="low_variance">Low variance</option>
            <option value="moderate_variance">Moderate variance</option>
            <option value="high_variance">High variance</option>
          </select>
        </div>
        <div>
          <label for="surprise_level">Surprise level</label>
          <select id="surprise_level">
            <option value="">Select</option>
            <option value="not_surprised">Not surprised</option>
            <option value="mild_surprise">Mild surprise</option>
            <option value="big_surprise">Big surprise</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Baseball Logic</h2>
      <div class="grid">
        <div>
          <label>Baseball signals missed</label>
          <div class="chip-row" id="baseball_miss_type"></div>
        </div>
        <div>
          <label for="primary_baseball_driver">Primary driver</label>
          <select id="primary_baseball_driver">
            <option value="">Select</option>
            <option value="none">None</option>
            <option value="starter">Starter</option>
            <option value="bullpen">Bullpen</option>
            <option value="lineup">Lineup</option>
            <option value="defense">Defense</option>
            <option value="park">Park</option>
            <option value="travel_rest">Travel/rest</option>
            <option value="weather">Weather</option>
            <option value="injury">Injury</option>
          </select>
        </div>
        <div>
          <label for="baseball_confidence">Baseball logic vs model</label>
          <select id="baseball_confidence">
            <option value="">Select</option>
            <option value="strong_support">Strong support</option>
            <option value="mild_support">Mild support</option>
            <option value="neutral">Neutral</option>
            <option value="mild_conflict">Mild conflict</option>
            <option value="strong_conflict">Strong conflict</option>
          </select>
        </div>
        <div>
          <label for="baseball_notes">Short notes (optional)</label>
          <textarea id="baseball_notes"></textarea>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Betting Logic</h2>
      <div class="grid">
        <div>
          <label>Market signals</label>
          <div class="chip-row" id="market_signal"></div>
        </div>
        <div>
          <label for="closing_line_value">Closing line value</label>
          <select id="closing_line_value">
            <option value="">Select</option>
            <option value="favored_model">Favored model</option>
            <option value="favored_market">Favored market</option>
            <option value="neutral">Neutral</option>
            <option value="not_available">Not available</option>
          </select>
        </div>
        <div>
          <label for="price_sensitivity">Price sensitivity</label>
          <select id="price_sensitivity">
            <option value="">Select</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div>
          <label for="betting_notes">Short notes (optional)</label>
          <textarea id="betting_notes"></textarea>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Feature Targets</h2>
      <div class="grid">
        <div>
          <label>Feature gaps</label>
          <div class="chip-row" id="missing_feature_flags"></div>
        </div>
        <div>
          <label for="feature_priority">Priority</label>
          <select id="feature_priority">
            <option value="">Select</option>
            <option value="must_have">Must have</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div>
          <label for="feature_target_detail">Short detail (optional)</label>
          <textarea id="feature_target_detail"></textarea>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Scoring</h2>
      <div class="grid two">
        <div>
          <label for="model_grade">Overall model grade</label>
          <select id="model_grade">
            <option value="">Select</option>
            <option value="5">5 (excellent)</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1 (poor)</option>
          </select>
        </div>
        <div>
          <label for="confidence_grade">Confidence grade</label>
          <select id="confidence_grade">
            <option value="">Select</option>
            <option value="5">5 (excellent)</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1 (poor)</option>
          </select>
        </div>
        <div>
          <label for="variance_grade">Variance grade</label>
          <select id="variance_grade">
            <option value="">Select</option>
            <option value="5">5 (excellent)</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1 (poor)</option>
          </select>
        </div>
        <div>
          <label for="review_time">Time spent</label>
          <select id="review_time">
            <option value="">Select</option>
            <option value="under_2_min">Under 2 minutes</option>
            <option value="under_5_min">Under 5 minutes</option>
            <option value="over_5_min">Over 5 minutes</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <button class="cta" id="submit_btn">Submit Feedback</button>
      <div class="status" id="status"></div>
    </section>
  </main>

  <script>
    const API_BASE = "";

    const multiSelectConfig = {
      baseball_miss_type: [
        { id: "no_baseball_issue", label: "No baseball issue" },
        { id: "starter_misread", label: "Starter misread" },
        { id: "bullpen_usage", label: "Bullpen usage" },
        { id: "lineup_change", label: "Lineup change" },
        { id: "defense_shift", label: "Defense shift" },
        { id: "park_factor", label: "Park factor" },
        { id: "travel_rest", label: "Travel/rest" },
        { id: "weather_impact", label: "Weather impact" },
        { id: "injury_news", label: "Injury news" }
      ],
      market_signal: [
        { id: "no_market_signal", label: "No market signal" },
        { id: "steam_against", label: "Steam against" },
        { id: "steam_with", label: "Steam with" },
        { id: "late_move", label: "Late move" },
        { id: "sharp_action", label: "Sharp action" }
      ],
      missing_feature_flags: [
        { id: "none_missing", label: "None" },
        { id: "bullpen_usage", label: "Bullpen usage" },
        { id: "pitcher_fatigue", label: "Pitcher fatigue" },
        { id: "lineup_confirmation", label: "Lineup confirmation" },
        { id: "platoon_splits", label: "Platoon splits" },
        { id: "park_factors", label: "Park factors" },
        { id: "weather_inputs", label: "Weather inputs" },
        { id: "umpire_tendencies", label: "Umpire tendencies" },
        { id: "travel_schedule", label: "Travel schedule" },
        { id: "defensive_metrics", label: "Defensive metrics" },
        { id: "market_metrics", label: "Market metrics" }
      ]
    };

    function renderMultiSelect(containerId, options) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      options.forEach(opt => {
        const label = document.createElement("label");
        label.className = "chip";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = opt.id;
        input.name = containerId;
        label.appendChild(input);
        label.appendChild(document.createTextNode(opt.label));
        container.appendChild(label);
      });
    }

    function getMultiSelectValues(name) {
      const inputs = Array.from(document.querySelectorAll(`input[name='${name}']:checked`));
      return inputs.map(input => input.value);
    }

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    async function loadPredictions() {
      const resp = await fetch(`${API_BASE}/api/v1/predictions/today`);
      const data = await resp.json();
      const select = document.getElementById("prediction_id");
      select.innerHTML = "<option value=''>Select game</option>";
      data.games.forEach(game => {
        const opt = document.createElement("option");
        opt.value = game.prediction_id;
        opt.textContent = `${game.away_team} @ ${game.home_team} (${game.game_date})`;
        opt.dataset.gameId = game.game_id || "";
        select.appendChild(opt);
      });

      const preset = getQueryParam("prediction_id");
      if (preset) {
        select.value = preset;
      }
    }

    function getAnalystRole(analystId) {
      if (analystId === "alex") {
        return "betting_logic";
      }
      return "sports_logic";
    }

    function buildPayload() {
      const analystId = document.getElementById("analyst_id").value;
      const predictionSelect = document.getElementById("prediction_id");
      const predictionId = predictionSelect.value;
      const gameId = predictionSelect.selectedOptions[0]?.dataset.gameId || "";

      return {
        prediction_id: predictionId,
        game_id: gameId,
        analyst_id: analystId,
        analyst_role: getAnalystRole(analystId),
        form_version: "2.0",
        form_responses: {
          review_summary: {
            review_stage: document.getElementById("review_stage").value,
            outcome_correct: document.getElementById("outcome_correct").value,
            spread_accuracy: document.getElementById("spread_accuracy").value,
            confidence_alignment: document.getElementById("confidence_alignment").value,
            variance_assessment: document.getElementById("variance_assessment").value,
            surprise_level: document.getElementById("surprise_level").value
          },
          baseball_logic: {
            baseball_miss_type: getMultiSelectValues("baseball_miss_type"),
            primary_baseball_driver: document.getElementById("primary_baseball_driver").value,
            baseball_confidence: document.getElementById("baseball_confidence").value,
            baseball_notes: document.getElementById("baseball_notes").value
          },
          betting_logic: {
            market_signal: getMultiSelectValues("market_signal"),
            closing_line_value: document.getElementById("closing_line_value").value,
            price_sensitivity: document.getElementById("price_sensitivity").value,
            betting_notes: document.getElementById("betting_notes").value
          },
          feature_targets: {
            missing_feature_flags: getMultiSelectValues("missing_feature_flags"),
            feature_priority: document.getElementById("feature_priority").value,
            feature_target_detail: document.getElementById("feature_target_detail").value
          },
          meta_scoring: {
            model_grade: document.getElementById("model_grade").value,
            confidence_grade: document.getElementById("confidence_grade").value,
            variance_grade: document.getElementById("variance_grade").value,
            review_time: document.getElementById("review_time").value
          }
        }
      };
    }

    async function submitFeedback() {
      const status = document.getElementById("status");
      status.textContent = "";
      status.className = "status";

      const payload = buildPayload();
      if (!payload.analyst_id || !payload.prediction_id) {
        status.textContent = "Select analyst and game before submitting.";
        status.classList.add("error");
        return;
      }

      const resp = await fetch(`${API_BASE}/api/v1/feedback/submit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        status.textContent = data.detail || "Submission failed.";
        status.classList.add("error");
        return;
      }

      const data = await resp.json();
      status.textContent = `Submitted! Feedback ID: ${data.feedback_id}`;
      status.classList.remove("error");
    }

    document.getElementById("submit_btn").addEventListener("click", submitFeedback);

    renderMultiSelect("baseball_miss_type", multiSelectConfig.baseball_miss_type);
    renderMultiSelect("market_signal", multiSelectConfig.market_signal);
    renderMultiSelect("missing_feature_flags", multiSelectConfig.missing_feature_flags);
    loadPredictions();
  </script>
</body>
</html>
