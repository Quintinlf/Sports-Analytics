# Render Blueprint — Sports Analytics Platform
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sports-analytics
    runtime: python
    buildCommand: pip install -r requirements-web.txt
    # Apply ORM + predictions schema once per deploy (not on every web boot).
    preDeployCommand: python -m scripts.init_database
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /feedback
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sports-analytics-db
          property: connectionString
      # Production web process skips runtime CREATE/ALTER (see schema_auto_migrate).
      - key: SCHEMA_AUTO_MIGRATE
        value: "false"
      - key: FEEDBACK_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FEEDBACK_EMAIL_FROM
        sync: false

databases:
  - name: sports-analytics-db
    plan: free
    databaseName: sports_analytics
    user: sports_analytics
