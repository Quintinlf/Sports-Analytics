name: Daily MLB Predictions

on:
  schedule:
    # 8 PM ET (1 AM UTC)
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  generate-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///./sports_analytics.db' }}
          LOG_DIR: logs
        run: |
          mkdir -p logs
          python -m scripts.run_daily_predictions

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-prediction-logs
          path: logs/
