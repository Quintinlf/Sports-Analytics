name: Daily Predictions Sync

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at 12:00 AM UTC daily
  workflow_dispatch:     # Allows manual pipeline testing from the UI

jobs:
  ingest-and-predict:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Execute Daily Prediction Pipeline
        run: python -m scripts.cron_daily_predictions

      - name: Preserve Error Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: execution-failure-logs
          path: ./*.log
          retention-days: 5

