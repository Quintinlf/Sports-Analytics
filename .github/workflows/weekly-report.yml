name: Weekly Prediction Report & Feedback

on:
  schedule:
    # Run every Sunday at 6 PM ET (22:00 UTC)
    - cron: "0 22 * * 0"
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate weekly report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///./sports_analytics.db' }}
          FEEDBACK_FORM_URL: ${{ secrets.FEEDBACK_FORM_URL }}
          LOG_DIR: logs
        run: |
          mkdir -p logs
          python scripts/generate_weekly_report.py

      - name: Send report email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Weekly MLB Prediction Report"
          to: ${{ secrets.TEST_RECIPIENT_EMAIL }}
          from: "MLB Predictions Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://reports/weekly_email.html
          reply_to: ${{ secrets.TEST_RECIPIENT_EMAIL }}

      - name: Archive report
        run: |
          mkdir -p archived_reports
          cp reports/weekly_email.html archived_reports/report_$(date +%Y%m%d).html

      - name: Upload report archive
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports
          path: archived_reports/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-logs
          path: logs/
