name: Weekly Reviewer Digest

on:
  schedule:
    # Target: Sunday & Wednesday 12:00 AM America/Los_Angeles.
    # GitHub Actions cron is UTC-only and does not follow DST, so we fire at both
    # possible UTC offsets; the Python script gates on America/Los_Angeles and
    # email_send_log so exactly one digest is delivered per PT send window.
    #
    #   PDT (UTC-7): midnight PT = 07:00 UTC
    #   PST (UTC-8): midnight PT = 08:00 UTC
    #
    # cron day-of-week: 0 = Sunday, 3 = Wednesday (UTC calendar day of the fire).
    - cron: "0 7,8 * * 0,3"
  workflow_dispatch:

jobs:
  send-reviewer-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Initialize database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.init_database

      - name: Send personalized weekly reviewer emails
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FEEDBACK_BASE_URL: ${{ secrets.FEEDBACK_BASE_URL }}
          FEEDBACK_EMAIL_FROM: ${{ secrets.FEEDBACK_EMAIL_FROM }}
        run: python -m scripts.send_weekly_feedback_form

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reviewer-digest-logs
          path: logs/
