name: Analyst Invite Email (Allowlist Only)

# Manual only — never auto-invite everyone.
on:
  workflow_dispatch:
    inputs:
      allowlist:
        description: "Comma-separated emails to invite (required)"
        required: true
        type: string

jobs:
  send-invites:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Initialize database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.init_database

      - name: Send analyst invitation emails (allowlist only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FEEDBACK_BASE_URL: ${{ secrets.FEEDBACK_BASE_URL }}
          FEEDBACK_EMAIL_FROM: ${{ secrets.FEEDBACK_EMAIL_FROM }}
          ANALYST_INVITE_ALLOWLIST: ${{ inputs.allowlist }}
        run: python -m scripts.send_analyst_invite
