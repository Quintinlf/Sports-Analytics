<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Side by side</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b0f14; --card:#151c28; --border:#1e2d42; --accent:#3b82f6; --text:#e2e8f0; --dim:#94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: "Inter", "Segoe UI", system-ui, sans-serif;
           display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    header a.home { color: var(--accent); font-size: 22px; text-decoration: none; }
    header h1 { font-size: 1rem; font-weight: 700; }
    .toggles { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
    .toggles button { background: var(--card); color: var(--dim); border: 1px solid var(--border); border-radius: 8px;
                      padding: 6px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
    .toggles button[aria-pressed="true"] { color: #fff; border-color: var(--accent); background: #1d3a66; }
    .toggles button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    main { flex: 1; display: grid; gap: 8px; padding: 8px; min-height: 0; }
    .pane { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .pane .bar { font-size: .75rem; color: var(--dim); padding: 4px 10px; border-bottom: 1px solid var(--border);
                 display: flex; justify-content: space-between; }
    .pane .bar a { color: var(--dim); }
    .pane iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
    .empty { display: grid; place-items: center; color: var(--dim); }
    @media (max-width: 800px) { main { grid-template-columns: 1fr !important; grid-auto-rows: 80vh; } }
  </style>
</head>
<body>
  <header>
    <a class="home" href="/" aria-label="Home">◎</a>
    <h1>Side by side</h1>
    <div class="toggles" id="toggles"></div>
  </header>
  <main id="panes"></main>
<script>
  // Every section of the app in its own pane; pick which are open. Remembered per browser.
  const PANES = [
    { key: "chess", label: "Chess", url: "/chess?embed=1" },
    { key: "poker", label: "Poker", url: "/poker?play=1" },
    { key: "sports", label: "Sports picks", url: "/feedback" },
    { key: "home", label: "Scoreboard", url: "/" },
  ];
  let open = ["chess", "sports"];
  try { open = JSON.parse(localStorage.getItem("workspace-panes")) || open; } catch { /* storage blocked */ }
  const frames = {};

  function save() { try { localStorage.setItem("workspace-panes", JSON.stringify(open)); } catch { /* ignore */ } }

  function layout() {
    const main = document.getElementById("panes");
    main.style.gridTemplateColumns = `repeat(${Math.max(open.length, 1)}, minmax(0, 1fr))`;
    for (const p of PANES) {
      let pane = frames[p.key];
      if (open.includes(p.key)) {
        if (!pane) {
          pane = document.createElement("section");
          pane.className = "pane";
          pane.innerHTML = `<div class="bar"><span>${p.label}</span><a href="${p.url.replace("?embed=1", "")}" target="_blank" rel="noopener">open alone ↗</a></div>
                            <iframe src="${p.url}" title="${p.label}"></iframe>`;
          frames[p.key] = pane;
        }
        main.appendChild(pane);            // keeps order; an open pane is moved, not reloaded
      } else if (pane) {
        pane.remove();
        delete frames[p.key];
      }
    }
    if (!open.length) main.innerHTML = '<p class="empty">Pick a section above.</p>';
    else main.querySelector(".empty")?.remove();
    document.querySelectorAll(".toggles button").forEach((b) => b.setAttribute("aria-pressed", open.includes(b.dataset.key)));
  }

  const toggles = document.getElementById("toggles");
  for (const p of PANES) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.key = p.key;
    b.textContent = p.label;
    b.addEventListener("click", () => {
      open = open.includes(p.key) ? open.filter((k) => k !== p.key) : [...open, p.key];
      save();
      layout();
    });
    toggles.appendChild(b);
  }
  layout();
</script>
</body>
</html>
